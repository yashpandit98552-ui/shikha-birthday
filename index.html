<script>
  /* ================= PASSWORD PROTECTION ================= */
  const CORRECT_PASSWORD = "YOUR_PASSWORD_HERE"; // 👈 Set your secret password here

  function checkAccess() {
    let entered = prompt("🔐 Please enter the password to view your surprise:");
    while (entered !== CORRECT_PASSWORD) {
      if (entered === null) {
        document.body.innerHTML = "<h2 style='text-align:center; margin-top:20%; font-family:sans-serif; color:#ff4b72;'>Access Denied 🔒</h2>";
        throw new Error("Access Denied");
      }
      entered = prompt("❌ Incorrect password. Please try again:");
    }
  }
  checkAccess();

  /* ================= AUTO-LOAD PHOTOS ================= */
  const TOTAL_PHOTOS = 84; // 👈 Set to your total number of photos
  const candidateImages = Array.from({ length: TOTAL_PHOTOS }, (_, i) => `photos/${i + 1}.jpg`);
  let validImages = [];

  function loadValidImages(callback) {
    let loadedCount = 0;
    candidateImages.forEach((src) => {
      const img = new Image();
      img.onload = function() {
        validImages.push(src);
        loadedCount++;
        if (loadedCount === candidateImages.length && callback) callback();
      };
      img.onerror = function() {
        loadedCount++;
        if (loadedCount === candidateImages.length && callback) callback();
      };
      img.src = src;
    });
  }

  /* ================= NO BUTTON DODGE LOGIC ================= */
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');

  function moveNoButtonRandomly() {
    const btnWidth = noBtn.offsetWidth || 120;
    const btnHeight = noBtn.offsetHeight || 50;
    const margin = 16;
    const maxX = window.innerWidth - btnWidth - margin;
    const maxY = window.innerHeight - btnHeight - margin;
    const randX = Math.max(margin, Math.random() * maxX);
    const randY = Math.max(margin, Math.random() * maxY);
    if (!noBtn.classList.contains('floating')) {
      noBtn.classList.add('floating');
    }
    noBtn.style.left = randX + 'px';
    noBtn.style.top = randY + 'px';
  }

  noBtn.addEventListener('mouseenter', moveNoButtonRandomly);
  noBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    moveNoButtonRandomly();
  }, { passive: false });

  noBtn.addEventListener('click', function(e) {
    e.preventDefault();
    document.getElementById('modalOverlay').classList.add('show');
    moveNoButtonRandomly();
  });

  window.addEventListener('resize', function() {
    if (noBtn.classList.contains('floating')) {
      moveNoButtonRandomly();
    }
  });

  document.getElementById('modalCloseBtn').addEventListener('click', function() {
    document.getElementById('modalOverlay').classList.remove('show');
  });

  /* ================= MUSIC ================= */
  const bgMusic = document.getElementById('bgMusic');
  bgMusic.volume = 0.85;

  function tryStartMusic() {
    if (!bgMusic.paused) return;
    const playPromise = bgMusic.play();
    if (playPromise !== undefined) {
      playPromise.catch(function(err) {
        console.log('Autoplay waiting for tap/click:', err);
      });
    }
  }

  window.addEventListener('DOMContentLoaded', tryStartMusic);
  function firstInteractionHandler() {
    tryStartMusic();
    document.removeEventListener('click', firstInteractionHandler);
    document.removeEventListener('touchstart', firstInteractionHandler);
  }
  document.addEventListener('click', firstInteractionHandler);
  document.addEventListener('touchstart', firstInteractionHandler);

  /* ================= YES BUTTON ACTION ================= */
  yesBtn.addEventListener('click', function() {
    document.getElementById('noScreen').style.display = 'none';
    document.getElementById('celebrationScreen').classList.add('show');
    tryStartMusic();
    startParticles();
    if (validImages.length > 0) {
      initSlideshow();
    } else {
      loadValidImages(() => { initSlideshow(); });
    }
  });

  /* ================= PARTICLE ANIMATION ================= */
  const particleSymbols = ['💖', '💕', '✨', '🎉', '🌸', '🎈'];

  function startParticles() {
    setInterval(spawnParticle, 220);
    for (let i = 0; i < 15; i++) {
      setTimeout(spawnParticle, i * 80);
    }
  }

  function spawnParticle() {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = particleSymbols[Math.floor(Math.random() * particleSymbols.length)];
    const startX = Math.random() * window.innerWidth;
    const duration = 4 + Math.random() * 3;
    const size = 16 + Math.random() * 18;
    p.style.left = startX + 'px';
    p.style.fontSize = size + 'px';
    p.style.animationDuration = duration + 's';
    particleLayer.appendChild(p);
    setTimeout(function() { p.remove(); }, duration * 1000 + 200);
  }

  /* ================= SLIDESHOW ================= */
  let currentSlide = 0;
  let slideInterval;

  function initSlideshow() {
    const wrap = document.getElementById('slideshowWrap');
    const dotsWrap = document.getElementById('dotsWrap');
    wrap.querySelectorAll('.slide-img').forEach(el => el.remove());
    dotsWrap.innerHTML = '';

    const activeImages = validImages.length > 0 ? validImages : candidateImages;
    activeImages.forEach(function(src, i) {
      const img = document.createElement('img');
      img.src = src;
      img.className = 'slide-img' + (i === 0 ? ' active' : '');
      img.alt = 'Memory photo ' + (i + 1);
      wrap.insertBefore(img, document.getElementById('prevBtn'));

      const dot = document.createElement('div');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.addEventListener('click', function() { goToSlide(i); });
      dotsWrap.appendChild(dot);
    });

    document.getElementById('nextBtn').addEventListener('click', function() {
      goToSlide((currentSlide + 1) % activeImages.length);
      resetSlideInterval();
    });
    document.getElementById('prevBtn').addEventListener('click', function() {
      goToSlide((currentSlide - 1 + activeImages.length) % activeImages.length);
      resetSlideInterval();
    });

    resetSlideInterval();
  }

  function goToSlide(index) {
    const slides = document.querySelectorAll('.slide-img');
    const dots = document.querySelectorAll('.dot');
    if (slides.length === 0) return;
    slides[currentSlide].classList.remove('active');
    if (dots[currentSlide]) dots[currentSlide].classList.remove('active');
    currentSlide = index;
    slides[currentSlide].classList.add('active');
    if (dots[currentSlide]) dots[currentSlide].classList.add('active');
  }

  function resetSlideInterval() {
    clearInterval(slideInterval);
    const slides = document.querySelectorAll('.slide-img');
    if (slides.length <= 1) return;
    slideInterval = setInterval(function() {
      goToSlide((currentSlide + 1) % slides.length);
    }, 10000); // Changes photo every 10 seconds
  }
</script>
